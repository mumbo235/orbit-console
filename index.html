<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORBIT Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#4aa3ff;
  --ts:clamp(70px,7.6vw,150px);
  --tb:calc(var(--ts)*2.05);
  --tbh:calc(var(--tb)*1.1);
  --gap:clamp(3px,.32vw,6px);
  --rowx:8vw;
  --rowy:15vh;
  --sel:0;
  --glass:rgba(10,20,50,.55);
  --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{display:block}
.hidden{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 45%,transparent)}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* ===== HOME ===== */
#home{position:fixed;inset:0;z-index:1;opacity:0;transition:opacity .6s}
#home.on{opacity:1}
#status{position:absolute;top:2.6vh;left:var(--rowx);right:var(--rowx);height:clamp(30px,3vh,40px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:clamp(12px,.92vw,16px);color:#fff;font-weight:300;transition:transform .35s}
#status .me{justify-self:center;display:flex;align-items:center;gap:9px}
#status .av{width:26px;height:26px;border-radius:4px;overflow:hidden}
#status .rt{justify-self:end;display:flex;align-items:center;gap:20px}
#status .np{display:flex;align-items:center;gap:6px;opacity:.85}
#status .np svg{width:14px;height:14px}
#status .pad{display:flex;align-items:center;gap:5px;opacity:.85}
#status .pad svg{width:18px;height:18px}
#status .tcount{display:flex;align-items:center;gap:6px}
#status .tcount svg{width:16px;height:16px}

#fbar{justify-self:start;display:flex;align-items:center;gap:clamp(16px,2.4vw,44px)}
#fbar .fi{position:relative;width:clamp(26px,1.9vw,34px);height:clamp(26px,1.9vw,34px);border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .25s,color .2s;color:#fff}
#fbar .fi svg{width:66%;height:66%;stroke-width:1.6}
#fbar .fi .lbl{position:absolute;top:135%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:300;opacity:0;transition:opacity .2s;pointer-events:none}
#fbar .fi .dot{position:absolute;top:0;right:0;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
#home.bar #status{transform:translateY(5vh)}
#home.bar #fbar .fi{transform:scale(1.25)}
#home.bar #fbar .fi.on{background:#fff;color:#0b2a7a;transform:scale(1.6);box-shadow:0 0 24px rgba(255,255,255,.55)}
#home.bar #fbar .fi.on .lbl{opacity:1;transform:translateX(-50%) scale(.62)}
#home.bar #rowwrap{opacity:.3;transform:translateY(12vh)}

#rowwrap{position:absolute;inset:0;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .35s;pointer-events:none}
#rowwrap>*{pointer-events:auto}
#row{position:absolute;left:var(--rowx);top:var(--rowy);will-change:transform;display:flex;gap:var(--gap);align-items:flex-start;transform:translateX(calc(var(--sel) * -1 * (var(--ts) + var(--gap))));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tile{flex:none;width:var(--ts);height:var(--ts);font-size:var(--ts);position:relative;overflow:hidden;contain:layout paint;cursor:pointer;
  background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.28),transparent 55%),radial-gradient(90% 80% at 100% 100%,rgba(0,0,0,.45),transparent 70%),linear-gradient(150deg,var(--g1),var(--g2));
  box-shadow:0 4px 14px rgba(0,0,10,.35);display:grid;place-items:center;
  transition:width .3s cubic-bezier(.2,.8,.2,1),height .3s cubic-bezier(.2,.8,.2,1),font-size .3s cubic-bezier(.2,.8,.2,1),opacity .3s,box-shadow .3s}
.tile::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);pointer-events:none}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(165deg,rgba(255,255,255,.18),transparent 38%);pointer-events:none}
.tile .ghost{position:absolute;right:-18%;bottom:-22%;width:85%;height:85%;font-size:.78em;line-height:1;display:grid;place-items:center;opacity:.2;transform:rotate(-14deg);pointer-events:none;color:#fff}
.tile .ghost svg{width:100%;height:100%}
.tile .ico{position:relative;width:40%;height:40%;color:#fff;filter:drop-shadow(0 3px 10px rgba(0,0,0,.35));transition:transform .3s}
.tile .ico svg{width:100%;height:100%;stroke-width:1.5}
.tile .emo{position:relative;font-size:.4em;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));transition:transform .3s}
.tile img.fav{position:relative;width:42%;height:42%;object-fit:contain;border-radius:18%;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.tile .wm{position:absolute;left:8%;right:8%;bottom:7%;font-size:clamp(9px,.62vw,12px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.6);transition:opacity .2s}
.tile .tname{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-size:clamp(12px,.9vw,16px);font-weight:400;opacity:0;transition:opacity .2s;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.tile .start{position:absolute;left:0;right:0;bottom:0;height:12%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border-top:1px solid rgba(255,255,255,.18);font-size:clamp(11px,.8vw,14px);font-weight:300;opacity:0;transition:opacity .2s}
.tile.sel{width:var(--tb);height:var(--tbh);font-size:var(--tb);box-shadow:0 0 0 3px #fff,0 0 34px rgba(255,255,255,.35),0 18px 44px rgba(0,0,20,.5)}
.tile.sel .ico,.tile.sel .mono,.tile.sel img.fav{transform:translateY(-16%)}
.tile.sel .tname,.tile.sel .start{opacity:1}
.tile.sel .wm{opacity:0}
.tile.past{opacity:0;pointer-events:none}
.tile .badge{position:absolute;top:6%;right:6%;font-size:clamp(8px,.55vw,10px);font-weight:600;padding:2px 5px;border-radius:2px;background:rgba(0,0,0,.4);letter-spacing:.06em}
#home.sub .tile.sel{box-shadow:0 0 0 1px rgba(255,255,255,.5),0 18px 44px rgba(0,0,20,.5)}

#ttl{position:absolute;left:calc(var(--rowx) + var(--tb) + var(--gap)*4);top:calc(var(--rowy) + var(--ts) + 1.6vh);font-size:clamp(22px,2.5vw,46px);font-weight:300;letter-spacing:-.005em;text-shadow:0 2px 14px rgba(0,0,40,.35);white-space:nowrap}
#ttl small{display:block;font-size:.4em;opacity:.75;font-weight:300;margin-top:.25em;letter-spacing:.01em}

#subarea{position:absolute;left:var(--rowx);right:0;top:calc(var(--rowy) + var(--tbh) + 4.5vh);height:clamp(150px,min(32vh,calc(100vh - var(--rowy) - var(--tbh) - 13vh)),360px);display:flex;gap:var(--gap);align-items:stretch;transition:opacity .3s;overflow:hidden}
.art{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 15% 0%,rgba(255,255,255,.25),transparent 55%),radial-gradient(80% 70% at 100% 100%,rgba(0,0,0,.5),transparent 70%),linear-gradient(150deg,var(--g1),var(--g2))}
.art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 16px);pointer-events:none}
.art .big{position:absolute;right:-6%;top:-8%;width:70%;height:90%;display:grid;place-items:center;opacity:.9;color:#fff;font-size:clamp(60px,7vw,140px);line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.art .big svg{width:70%;height:70%;stroke-width:1.2}
.art .scrim{position:absolute;left:0;right:0;bottom:0;padding:16% 7% 7%;background:linear-gradient(transparent,rgba(0,0,20,.75))}
#desc{flex:none;width:clamp(260px,30vw,560px);contain:layout paint;box-shadow:0 10px 30px rgba(0,0,20,.35)}
#desc .scrim h3{font-weight:300;font-size:clamp(18px,1.6vw,28px);margin-bottom:6px}
#desc .scrim p{font-size:clamp(12px,.85vw,15px);line-height:1.5;opacity:.85;font-weight:300;max-width:90%}
#desc .meta{margin-top:10px;font-size:11px;opacity:.6;letter-spacing:.12em;text-transform:uppercase}
#acts{flex:1;display:flex;gap:var(--gap);min-width:0}
/* Unselected cards are dimmed with an inset shade rather than filter:brightness, which forced every card onto its own filter layer. */
.act{flex:none;width:clamp(150px,15vw,290px);height:100%;text-align:left;cursor:pointer;contain:layout paint;transition:transform .25s,box-shadow .25s;box-shadow:inset 0 0 0 999px rgba(0,0,10,.1),0 10px 30px rgba(0,0,20,.3)}
.act .big{font-size:clamp(40px,4.4vw,90px);top:4%;right:0;left:0;width:auto;height:62%}
.act b{display:block;font-weight:400;font-size:clamp(13px,1vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act span.s{font-size:12px;opacity:.7;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300}
.act:hover{box-shadow:0 10px 30px rgba(0,0,20,.3)}
#home.sub .act.on{box-shadow:0 0 0 3px #fff,0 0 30px rgba(255,255,255,.35);z-index:1}

#legend{position:absolute;right:var(--rowx);bottom:2.6vh;display:flex;gap:24px;font-size:13px;font-weight:300;opacity:.85}
#legend span{display:flex;align-items:center;gap:7px}
kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;border:1px solid rgba(255,255,255,.7);font:500 11px Inter,system-ui;background:rgba(0,0,0,.12)}

.lg{display:block;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}
.lg.fv{background:#fff;border-radius:22%;padding:10%;box-shadow:0 4px 14px rgba(0,0,0,.3);filter:none}
.tile .lg{position:relative;width:40%;height:40%;transition:transform .3s}
.tile .lg.fv{width:44%;height:44%}
.tile.sel .lg{transform:translateY(-16%)}
.tile .ghost .lg,.tile .ghost .emo{width:100%;height:100%;font-size:inherit;filter:none;background:none;box-shadow:none;padding:0}
.art .big .lg{width:52%;height:52%}
.act .big .lg{width:auto;height:58%;max-width:60%}
.act .big svg{width:38%;height:38%;stroke-width:1.4}
.act .big .avt{width:34%;height:auto;aspect-ratio:1;border-radius:50%}
.act .big .avt svg{width:56%;height:56%}
.tlogo .avt{border-radius:5px}
.si .lg,.di .lg,.wi .lg,.lti .lg,.aicon .lg,.tlogo .lg{width:56%;height:56%}
.si .lg.fv,.di .lg.fv,.wi .lg.fv,.lti .lg.fv,.aicon .lg.fv{width:64%;height:64%}
.lti .lg{width:42%;height:42%}
.fi2 .lg{width:20px;height:20px;padding:2px}
.tlogo{width:38px;height:38px;border-radius:5px;display:grid;place-items:center;background:linear-gradient(150deg,var(--g1),var(--g2))}
.tlogo .lg{width:60%;height:60%}

.avt{display:grid;place-items:center;width:100%;height:100%;border-radius:inherit;color:#fff;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 55%),linear-gradient(150deg,var(--g1),var(--g2))}
.avt svg{width:56%;height:56%;stroke-width:1.7;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.mono{display:grid;place-items:center;width:42%;aspect-ratio:1;border-radius:22%;background:rgba(255,255,255,.95);color:#0b1a40;font-weight:700;font-size:.24em;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);position:relative}
.si .mono,.di .mono,.wi .mono,.lti .mono,.aicon .mono,.fi2 .mono{font-size:15px;width:60%}
.art .big .mono{font-size:clamp(28px,3vw,60px);width:40%}
.tile .ghost .mono{display:none}

.pairs{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.2vw,16px);width:min(560px,92vw,calc(100vh - 220px));margin:0 auto}
.pc{aspect-ratio:1;perspective:900px;padding:0;border-radius:10px}
.pc .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.pc.open .in,.pc.done .in{transform:rotateY(180deg)}
.pc .f,.pc .b{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,20,.35)}
.pc .b{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.25),transparent 55%),repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 6px,transparent 6px 14px),linear-gradient(150deg,#2a5bd7,#0b2470);border:1px solid rgba(255,255,255,.2)}
.pc .b svg{width:34%;height:34%;opacity:.55}
.pc .f{transform:rotateY(180deg);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 55%),linear-gradient(150deg,var(--g1),var(--g2));color:#fff}
.pc .f svg{width:46%;height:46%;stroke-width:1.6;filter:drop-shadow(0 3px 8px rgba(0,0,0,.3))}
.pc.done .f{box-shadow:0 0 0 2px #fff,0 0 24px rgba(255,255,255,.4)}
.pc:focus-visible{outline:none;box-shadow:0 0 0 3px #fff,0 0 24px rgba(255,255,255,.4)}
.pstat{display:flex;justify-content:center;gap:40px;margin:22px 0 20px;font-size:14px}
.pstat b{display:block;font-size:26px;font-weight:300}
/* ===== APP LAYER ===== */
#app{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;background:linear-gradient(160deg,rgba(6,14,40,.86),rgba(4,8,24,.94));backdrop-filter:blur(26px) saturate(1.2);opacity:0;transform:scale(1.06);pointer-events:none;transition:opacity .28s,transform .35s cubic-bezier(.2,.8,.2,1)}
#app.open{opacity:1;transform:none;pointer-events:auto}
/* Once an app has finished opening, the background canvas is frozen and pre-blurred, so the live backdrop blur
   (re-run every frame while a video or page animates on top) and the hidden home screen can be dropped. */
body.appset #app{backdrop-filter:none}
body.appset #home{visibility:hidden}
#app>header{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.18)}
#app .aicon{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;background:linear-gradient(150deg,var(--g1),var(--g2));font-size:17px;overflow:hidden}
#app .aicon svg{width:60%;height:60%}
#app .aicon img{width:70%;height:70%}
#app .atitle{font-size:16px;font-weight:500}
#app .aextra{flex:1;display:flex;justify-content:flex-end;gap:6px}
#abody{flex:1;min-height:0;position:relative;overflow:auto}
.hbtn{height:34px;padding:0 13px;border-radius:17px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:13px;transition:background .15s}
.hbtn:hover,.hbtn:focus-visible{background:rgba(255,255,255,.18)}
.hbtn svg{width:16px;height:16px}

/* common UI */
.pane{padding:32px clamp(18px,4vw,64px);max-width:1300px;margin:0 auto}
.h1{font-size:clamp(22px,2vw,32px);font-weight:300;margin-bottom:6px}
.muted{opacity:.6}
.sec{margin-top:30px}
.sec>h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;font-weight:500;margin-bottom:14px}
.btn{height:38px;padding:0 18px;border-radius:5px;background:rgba(255,255,255,.1);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-size:14px;transition:background .15s,transform .15s}
.btn:hover,.btn:focus-visible{background:rgba(255,255,255,.2)}
.btn.pri{background:var(--accent);border-color:transparent;color:#041030;font-weight:600}
.btn.pri:hover,.btn.pri:focus-visible{filter:brightness(1.1)}
.btn.dng{background:rgba(255,70,90,.18);border-color:rgba(255,90,110,.4)}
.btn svg{width:16px;height:16px}
.inp{height:40px;padding:0 14px;border-radius:5px;background:rgba(0,0,0,.3);border:1px solid var(--line);width:100%;user-select:text}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 18px) 17px,calc(100% - 13px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
select.inp option{background:#0b1430}
label.f{display:block;font-size:12px;opacity:.65;margin:0 0 6px;letter-spacing:.04em}
.grid{display:grid;gap:14px}
.card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:18px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:14px 16px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:left;font-size:14px}
.tog:hover,.tog:focus-visible{background:rgba(255,255,255,.12)}
.tog .sw{width:42px;height:24px;border-radius:12px;background:rgba(255,255,255,.2);position:relative;flex:none;transition:background .2s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on .sw{background:var(--accent)}
.tog.on .sw::after{transform:translateX(18px)}
.tog small{display:block;opacity:.55;font-size:12px;margin-top:3px}

/* toasts */
#toasts{position:fixed;top:18px;left:18px;z-index:20;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{min-width:300px;max-width:400px;display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:6px;background:rgba(12,22,52,.92);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4);backdrop-filter:blur(14px);animation:tin .4s cubic-bezier(.2,.8,.2,1)}
.toast.out{animation:tout .35s forwards}
.toast .ti{width:38px;height:38px;flex:none;border-radius:5px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:20px}
.toast .ti svg{width:22px;height:22px}
.toast b{font-weight:500;font-size:14px;display:block}
.toast span{font-size:12px;opacity:.7}
@keyframes tin{from{opacity:0;transform:translateX(-30px)}}
@keyframes tout{to{opacity:0;transform:translateX(-30px)}}

/* quick menu */
#quick{position:fixed;inset:0;z-index:12;display:flex;pointer-events:none}
#quick .qbg{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s}
#quick .qp{position:relative;width:min(380px,90vw);height:100%;background:rgba(8,16,42,.95);border-right:1px solid var(--line);backdrop-filter:blur(20px);transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:28px 16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
#quick.open{pointer-events:auto}
#quick.open .qbg{opacity:1}
#quick.open .qp{transform:none}
#quick h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;font-weight:500;padding:0 12px 14px}
.qi{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:5px;text-align:left;font-size:15px;width:100%}
.qi svg{width:20px;height:20px;opacity:.85}
.qi:hover,.qi:focus-visible{background:rgba(255,255,255,.95);color:#0a1840;outline:none;box-shadow:none}
.qi small{margin-left:auto;opacity:.6;font-size:12px}
.qsep{height:1px;background:var(--line);margin:8px 6px}
.qnp{padding:12px 14px;border-radius:6px;background:rgba(255,255,255,.06);margin-bottom:8px;font-size:13px}
.qnp b{display:block;font-weight:500;font-size:14px;margin-top:2px}

/* modal */
#modal{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#modal.open{opacity:1;pointer-events:auto}
#modal .mb{width:min(460px,92vw);background:rgba(10,20,52,.97);border:1px solid var(--line);border-radius:8px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:scale(.96);transition:transform .25s}
#modal.open .mb{transform:none}
#modal h3{font-weight:400;font-size:20px;margin-bottom:8px}
#modal p{opacity:.7;font-size:14px;line-height:1.5;margin-bottom:18px}
#modal .mbtns{display:flex;flex-direction:column;gap:8px}
#modal .mbtns .btn{justify-content:flex-start;height:46px}

/* boot / power screens */
#screen{position:fixed;inset:0;z-index:30;background:#000;display:grid;place-items:center;transition:opacity .8s}
#screen.fade{opacity:0;pointer-events:none}
.logo{display:flex;align-items:center;gap:18px}
.logo .ring{width:64px;height:64px;position:relative}
.logo .ring svg{width:100%;height:100%;overflow:visible}
.logo .word{font-size:38px;font-weight:200;letter-spacing:.42em;margin-right:-.42em}
.boot .logo{animation:lg 3.2s ease forwards;opacity:0}
.boot .ring .orb{animation:spin 2.4s cubic-bezier(.4,0,.2,1) forwards;transform-origin:32px 32px}
@keyframes lg{0%{opacity:0;filter:blur(8px);transform:scale(.96)}25%{opacity:1;filter:blur(0);transform:none}80%{opacity:1}100%{opacity:0}}
@keyframes spin{from{transform:rotate(-200deg)}to{transform:rotate(0)}}
.press{position:absolute;bottom:14vh;left:0;right:0;text-align:center;font-size:15px;opacity:.75;animation:blink 2.4s ease-in-out infinite;display:flex;justify-content:center;align-items:center;gap:8px}
@keyframes blink{50%{opacity:.25}}
.offmsg{font-size:13px;opacity:.4;letter-spacing:.2em;text-transform:uppercase}
.users{display:flex;flex-direction:column;align-items:center;gap:22px;animation:fadeup .7s ease}
.users .big{width:150px;height:150px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 60px color-mix(in srgb,var(--accent) 60%,transparent)}
.users .nm{font-size:28px;font-weight:300}
.users .wel{font-size:14px;opacity:.6;letter-spacing:.15em;text-transform:uppercase}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}}
#rest{position:fixed;inset:0;z-index:40;background:#000;display:none;place-items:end center;padding-bottom:10vh;cursor:pointer}
#rest.on{display:grid}
#rest .led{width:38px;height:4px;border-radius:2px;background:#ff9a2e;box-shadow:0 0 18px #ff9a2e;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{opacity:.15}}
#rest .rt{position:absolute;bottom:6vh;font-size:12px;opacity:.25;letter-spacing:.2em;text-transform:uppercase}

/* browser */
.bwrap{display:flex;flex-direction:column;height:100%}
.bbar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.2)}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .15s}
.ib:hover,.ib:focus-visible{background:rgba(255,255,255,.15)}
.ib svg{width:18px;height:18px}
.ib.on{color:#ffd34a}
.urlw{flex:1;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.urlw:focus-within{border-color:var(--accent)}
.urlw svg{width:16px;height:16px;opacity:.6;flex:none}
.urlw input{flex:1;background:none;border:0;outline:none;height:100%;user-select:text;font-size:14px}
.bview{flex:1;position:relative;min-height:0}
.bview iframe,.bview webview{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.bhint{font-size:12px;padding:6px 14px;opacity:.6;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center}
.bhint button{text-decoration:underline;font-size:12px}
.bhome{position:absolute;inset:0;overflow:auto;padding:7vh 4vw}
.bsearch{max-width:640px;margin:0 auto 40px;display:flex;flex-direction:column;align-items:center;gap:20px}
.bsearch .logo .word{font-size:26px}
.bsearch .logo .ring{width:40px;height:40px}
.bsearch .urlw{width:100%;height:50px;border-radius:25px}
.dial{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;max-width:900px;margin:0 auto}
.dial button{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px;border-radius:8px;transition:background .15s;font-size:13px}
.dial button:hover,.dial button:focus-visible{background:rgba(255,255,255,.1)}
.dial .di{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:linear-gradient(150deg,var(--g1),var(--g2));box-shadow:0 6px 16px rgba(0,0,0,.3)}
.dial span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* store */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);font-size:13px;background:rgba(255,255,255,.05)}
.chip.on{background:#fff;color:#0a1840}
.chip:hover,.chip:focus-visible{background:rgba(255,255,255,.18)}
.chip.on:focus-visible{background:#fff}
.sgrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.scard{display:flex;gap:14px;align-items:flex-start;content-visibility:auto;contain-intrinsic-size:auto 150px}
.scard .si{width:64px;height:64px;flex:none;border-radius:6px;display:grid;place-items:center;font-size:30px;background:linear-gradient(150deg,var(--g1),var(--g2));box-shadow:0 6px 16px rgba(0,0,0,.3)}
.scard h4{font-weight:500;font-size:15px}
.scard .cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin:2px 0 6px}
.scard p{font-size:13px;opacity:.75;line-height:1.45;margin-bottom:10px}
.scard .row{display:flex;gap:6px;flex-wrap:wrap}
.scard .btn{height:32px;padding:0 12px;font-size:13px}
.mode{font-size:10px;padding:2px 6px;border-radius:3px;background:rgba(255,255,255,.1);margin-left:6px;vertical-align:middle;letter-spacing:.05em}
.form{grid-template-columns:2fr 3fr 1fr 1.3fr auto;align-items:end}
@media (max-width:900px){.form{grid-template-columns:1fr 1fr}}

/* settings */
.set{display:flex;height:100%}
.set nav{width:250px;flex:none;border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.set nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:5px;text-align:left;font-size:14px}
.set nav button svg{width:18px;height:18px;opacity:.8}
.set nav button.on{background:rgba(255,255,255,.1)}
.set nav button:hover,.set nav button:focus-visible{background:rgba(255,255,255,.95);color:#0a1840;box-shadow:none}
.set .sp{flex:1;overflow:auto;padding:28px clamp(18px,3vw,48px)}
.set .sp>*{max-width:820px}
.themes{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.th{height:96px;border-radius:7px;position:relative;overflow:hidden;text-align:left;padding:12px;display:flex;align-items:flex-end;font-size:13px;font-weight:500;border:2px solid transparent}
.th.on{border-color:#fff}
.th i{position:absolute;right:10px;top:10px;width:14px;height:14px;border-radius:50%}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{width:54px;height:54px;border-radius:50%;padding:3px;background:none;border:2px solid transparent}
.avs button .avt{border-radius:50%}
.avs button.on{border-color:#fff}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.wrow .wi{width:38px;height:38px;flex:none;border-radius:5px;display:grid;place-items:center;font-size:19px;background:linear-gradient(150deg,var(--g1),var(--g2))}
.wrow .wn{flex:1;min-width:0}
.wrow .wn b{font-weight:500;font-size:14px}
.wrow .wn div{font-size:12px;opacity:.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .ib{width:32px;height:32px}
.kv{display:grid;grid-template-columns:180px 1fr;gap:10px 18px;font-size:14px}
.kv dt{opacity:.55}
.kv dd{word-break:break-word}
input[type=range]{width:100%;accent-color:var(--accent)}

/* trophies & feed */
.tsum{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.lvl{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;position:relative}
.lvl b{font-size:28px;font-weight:300}
.lvl svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tiers{display:flex;gap:18px;font-size:14px}
.tiers span{display:flex;align-items:center;gap:6px}
.cup{width:22px;height:22px;flex:none}
.tlist{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.tr{display:flex;gap:14px;align-items:center}
.tr .tb{width:52px;height:52px;flex:none;border-radius:6px;display:grid;place-items:center;background:rgba(0,0,0,.3)}
.tr .tb svg{width:28px;height:28px}
.tr.lock{opacity:.4}
.tr h4{font-weight:500;font-size:15px}
.tr p{font-size:13px;opacity:.7}
.tr .when{font-size:11px;opacity:.5;margin-top:3px}
.feed{display:flex;flex-direction:column;gap:8px}
.fe{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:6px;background:rgba(255,255,255,.05);font-size:14px}
.fe .fi2{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:17px}
.fe .fi2 svg{width:18px;height:18px}
.fe time{margin-left:auto;font-size:12px;opacity:.5;white-space:nowrap}
.stats{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.stat b{display:block;font-size:30px;font-weight:300}
.stat span{font-size:12px;opacity:.6;letter-spacing:.06em;text-transform:uppercase}

/* music */
.mus{display:grid;grid-template-columns:minmax(260px,360px) 1fr;height:100%}
.mus .tl{border-right:1px solid var(--line);padding:22px 12px;overflow:auto}
.trk{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:6px;text-align:left}
.trk .tc{width:44px;height:44px;border-radius:4px;flex:none;background:linear-gradient(150deg,var(--g1),var(--g2));display:grid;place-items:center}
.trk .tc svg{width:20px;height:20px}
.trk b{font-weight:500;font-size:14px;display:block}
.trk span{font-size:12px;opacity:.55}
.trk.on{background:rgba(255,255,255,.1)}
.trk:hover,.trk:focus-visible{background:rgba(255,255,255,.95);color:#0a1840;box-shadow:none}
.mus .stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:30px}
.mus canvas{width:100%;max-width:760px;height:260px}
.mus .now{text-align:center}
.mus .now b{font-size:30px;font-weight:300;display:block}
.mus .ctl{display:flex;gap:14px;align-items:center}
.mus .ctl .ib{width:52px;height:52px;background:rgba(255,255,255,.08)}
.mus .ctl .ib.play{width:68px;height:68px;background:#fff;color:#0a1840}
.mus .ctl .ib svg{width:22px;height:22px}

/* drift game */
.game{position:absolute;inset:0}
.game canvas{width:100%;height:100%;display:block;cursor:none}
.ghud{position:absolute;top:18px;left:24px;right:24px;display:flex;justify-content:space-between;font-size:15px;pointer-events:none}
.ghud b{font-size:26px;font-weight:300;display:block}
.gover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.gover div{background:rgba(0,0,0,.45);padding:30px 50px;border-radius:10px;border:1px solid var(--line);backdrop-filter:blur(8px)}
.gover h2{font-weight:200;font-size:44px;letter-spacing:.1em}
.gover p{opacity:.75;margin-top:8px}

.lib{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.lt{display:flex;flex-direction:column;gap:8px;text-align:left;border-radius:6px;padding:8px;transition:background .15s}
.lt:hover,.lt:focus-visible{background:rgba(255,255,255,.1)}
.lt .lti{aspect-ratio:1;border-radius:4px;display:grid;place-items:center;background:linear-gradient(150deg,var(--g1),var(--g2));font-size:44px}
.lt .lti svg{width:40%;height:40%}
.lt .lti img{width:44%;height:44%}
.lt span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:720px){
  :root{--rowx:5vw;--ts:74px;--rowy:21vh}
  #legend{display:none}
  #desc{display:none}
  .set{flex-direction:column}.set nav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .mus{grid-template-columns:1fr;grid-template-rows:auto 1fr}.mus .tl{border-right:0;max-height:34vh}
  #ttl{font-size:20px}
  #stName,#fbar .fi:nth-child(n+5){display:none}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="home">
  <div id="status">
    <div id="fbar"></div>
    <div class="me"><div class="av" id="stAv"></div><span id="stName"></span></div>
    <div class="rt"><div class="np hidden" id="stNp"></div><div class="pad hidden" id="stPad"></div><div class="tcount" id="stTro"></div><div id="clock"></div></div>
  </div>
  <div id="rowwrap">
    <div id="row"></div>
    <div id="ttl"></div>
    <div id="subarea"><div id="desc"></div><div id="acts"></div></div>
  </div>
  <div id="legend">
    <span><kbd>↑</kbd>Function area</span>
    <span><kbd>Enter</kbd>Start</span>
    <span><kbd>Esc</kbd>Back</span>
    <span><kbd>Q</kbd>Quick menu</span>
  </div>
</div>

<div id="app">
  <header>
    <div class="aicon" id="aIcon"></div>
    <div class="atitle" id="aTitle"></div>
    <div class="aextra" id="aExtra"></div>

  </header>
  <main id="abody"></main>
</div>

<div id="quick"><div class="qbg"></div><div class="qp" id="qp"></div></div>
<div id="modal"><div class="mb" id="mb"></div></div>
<div id="toasts"></div>
<div id="rest"><div class="led"></div><div class="rt">Rest mode — press any key</div></div>
<div id="screen"></div>

  left:sv('<path d="M15 18l-6-6 6-6"/>'), right:sv('<path d="M9 18l6-6-6-6"/>'),
  tab:sv('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>'),
  snake:sv('<path d="M4 19c0-2.5 2-3.5 4.5-3.5h6c2.5 0 4-1.3 4-3.5s-1.5-3.5-4-3.5h-5C7 8.5 5.5 7.2 5.5 5.5S7 2.5 9 2.5h9"/><circle cx="19.5" cy="2.8" r=".6" fill="currentColor"/>'),

let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch{}return AC}
function tone(f,d=.1,type='sine',v=.1,when=0,f2){
  if(!S.sound)return;const c=ac();if(!c)return;const t=c.currentTime+when;
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*S.vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05);
}
const sfx={
  move(){tone(1250,.05,'sine',.05)},
  ok(){tone(880,.07,'sine',.09);tone(1320,.14,'sine',.07,.055)},
  back(){tone(760,.07,'sine',.07);tone(520,.12,'sine',.06,.05)},
  err(){tone(220,.18,'triangle',.08)},
  open(){tone(523,.25,'sine',.06);tone(784,.3,'sine',.05,.06);tone(1046,.4,'sine',.04,.12)},
  trophy(){[1046,1318,1568,2093].forEach((f,i)=>tone(f,.5,'sine',.07,i*.08))},
  chime(){if(!S.sound)return;const c=ac();if(!c)return;[[261.6,0],[329.6,.15],[392,.3],[493.9,.45],[587.3,.6],[784,.8]].forEach(([f,w])=>{
    const t=c.currentTime+w,o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain();o.frequency.value=f;o2.frequency.value=f*2.003;o2.type='sine';
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06*S.vol,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);
    o.connect(g);o2.connect(g);g.connect(c.destination);o.start(t);o2.start(t);o.stop(t+3.3);o2.stop(t+3.3)})},
  whoosh(){if(!S.sound)return;const c=ac();if(!c)return;const n=c.createBufferSource(),b=c.createBuffer(1,c.sampleRate*.6,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(400,c.currentTime);
    f.frequency.exponentialRampToValueAtTime(3000,c.currentTime+.5);const g=c.createGain();g.gain.value=.06*S.vol;n.connect(f).connect(g).connect(c.destination);n.start()},

/* ================= background ================= */
const cv=$('#bg'),cx=cv.getContext('2d',{alpha:false});let W,H;const DPR=Math.min(devicePixelRatio||1,1.5);
// Setting canvas.width reallocates and clears the canvas, so only do it when the on-screen size actually changes.
function fitCanvas(c){const w=Math.round(c.clientWidth*DPR),h=Math.round(c.clientHeight*DPR);if(c.width!==w)c.width=w;if(c.height!==h)c.height=h;return[w,h]}
const parts=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.3,s:Math.random()*.00004+.00001,p:Math.random()*6}));
// The sky gradients and wave gradients only change with window size or theme, so they're built once into a cache.
let bgCache=null,bgStill=false,lastBG=0;
function resize(){const k=.5;W=cv.width=Math.max(1,Math.round(innerWidth*k));H=cv.height=Math.max(1,Math.round(innerHeight*k));bgCache=null;bgStill=false}
addEventListener('resize',resize);
function buildBG(th){
  const base=document.createElement('canvas');base.width=W;base.height=H;const b=base.getContext('2d');
  const g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,th.bg[0]);g.addColorStop(.55,th.bg[1]);g.addColorStop(1,th.bg[2]);
  b.fillStyle=g;b.fillRect(0,0,W,H);
  let rg=b.createRadialGradient(W*.5,H*.95,0,W*.5,H*.95,W*.65);rg.addColorStop(0,`rgba(${th.wave},.28)`);rg.addColorStop(1,`rgba(${th.wave},0)`);b.fillStyle=rg;b.fillRect(0,0,W,H);
  rg=b.createRadialGradient(W*.15,0,0,W*.15,0,W*.5);rg.addColorStop(0,'rgba(255,255,255,.08)');rg.addColorStop(1,'rgba(255,255,255,0)');b.fillStyle=rg;b.fillRect(0,0,W,H);
  const bands=[0,1,2].map(i=>{const base=.62+i*.07,lg=cx.createLinearGradient(0,H*base-H*.1,0,H*base+H*.15);lg.addColorStop(0,`rgba(${th.wave},0)`);lg.addColorStop(.5,`rgba(${th.wave},${.07+i*.02})`);lg.addColorStop(1,`rgba(${th.wave},0)`);return lg});
  const ribbons=[0,1,2,3,4,5,6].map(i=>{const lg=cx.createLinearGradient(0,0,W,0),a=.18+.06*(i%3);
    lg.addColorStop(0,`rgba(255,255,255,0)`);lg.addColorStop(.25,`rgba(255,255,255,${a*.6})`);lg.addColorStop(.55,`rgba(255,255,255,${a})`);lg.addColorStop(.85,`rgba(255,255,255,${a*.5})`);lg.addColorStop(1,'rgba(255,255,255,0)');return lg});
  return{th,base,bands,ribbons};
}
resize();
function wy(x,t,i,base,amp){const k=1/W;return H*base+Math.sin(x*k*(2.2+i*.35)+t*.00018*(1+i*.25)+i*1.3)*H*amp+Math.sin(x*k*(5.1-i*.4)-t*.00011*(1+i*.2)+i*2.7)*H*amp*.45}
function drawBG(t,dt=16.7){
  const th=theme();if(!bgCache||bgCache.th!==th)bgCache=buildBG(th);
  cx.globalCompositeOperation='source-over';cx.drawImage(bgCache.base,0,0);
  if(S.waves){
    cx.globalCompositeOperation='lighter';
    // broad soft bands
    for(let i=0;i<3;i++){
      const base=.62+i*.07,amp=.07-i*.012;
      cx.beginPath();
      for(let x=0;x<=W;x+=8){const y=wy(x,t,i,base,amp);x?cx.lineTo(x,y):cx.moveTo(x,y)}
      for(let x=W;x>=0;x-=8){cx.lineTo(x,wy(x,t+4000,i,base+.06+.04*Math.sin(t*.0002+i),amp*1.2))}
      cx.closePath();cx.fillStyle=bgCache.bands[i];cx.fill();
    }
    // thin glowing ribbons
    for(let i=0;i<7;i++){
      const base=.6+i*.035,amp=.06+(i%3)*.012;
      cx.beginPath();
      for(let x=0;x<=W;x+=6){const y=wy(x,t,i+.5,base,amp);x?cx.lineTo(x,y):cx.moveTo(x,y)}
      cx.strokeStyle=bgCache.ribbons[i];cx.lineWidth=i%3===0?1.4:.8;cx.stroke();
    }
  }
  if(S.particles){
    cx.globalCompositeOperation='lighter';
    for(const p of parts){p.y-=p.s*dt;if(p.y<-.02){p.y=1.02;p.x=Math.random()}
      const a=.2+.3*Math.sin(t*.002+p.p);if(a<=0)continue;cx.fillStyle=`rgba(255,255,255,${a})`;cx.beginPath();cx.arc(p.x*W,p.y*H,p.r*.6,0,7);cx.fill()}
  }
  cx.globalCompositeOperation='source-over';
}
// The waves drift slowly, so 30fps looks identical to 60 at half the cost. While an app, rest mode or the
// power screen covers the home screen the background is drawn once and then left still.
function bgLoop(t){
  requestAnimationFrame(bgLoop);
  if(document.hidden)return;
  // The page can load before the window has a size (no resize event follows), so keep checking.
  if(W!==Math.max(1,Math.round(innerWidth*.5))||H!==Math.max(1,Math.round(innerHeight*.5)))resize();
  if(cur||phase==='rest'){
    if(!bgStill){drawBG(t);if(cur){cx.filter='blur(13px) saturate(1.2)';cx.drawImage(cv,0,0);cx.filter='none'}bgStill=true}
    lastBG=t;return}
  if(bgStill){bgStill=false;lastBG=t-33}
  if(t-lastBG<30)return;
  drawBG(t,Math.min(t-lastBG,100));lastBG=t;
}

/* ---- spatial navigation ---- */
function spatial(root,dir){
  const els=$$(NAVSEL,root).filter(e=>e.offsetParent!==null&&!e.closest('.hidden'));
  if(!els.length)return;
  let c=document.activeElement;
  if(!root.contains(c)||!els.includes(c)){els[0].focus();sfx.move();return}
  const r=c.getBoundingClientRect(),X=r.left+r.width/2,Y=r.top+r.height/2;
  let best=null,bd=1e9;
  for(const e of els){if(e===c)continue;const q=e.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,dx=x-X,dy=y-Y;
    const ok=dir==='left'?(q.right<=r.left+4||dx<-r.width/2):dir==='right'?(q.left>=r.right-4||dx>r.width/2):dir==='up'?(q.bottom<=r.top+4):(q.top>=r.bottom-4);
    if(!ok)continue;const h=dir==='left'||dir==='right';const d=(h?Math.abs(dx):Math.abs(dy))+(h?Math.abs(dy):Math.abs(dx))*2.2;if(d<bd){bd=d;best=e}}
  if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});sfx.move()}
}
function appInput(b){
  if(cur.handle&&cur.handle(b))return;
  const root=$('#app');
  if(['up','down','left','right'].includes(b))return spatial(root,b);
  if(b==='ok'){const a=document.activeElement;if(a&&root.contains(a)&&a.matches('button,[data-nav]')){sfx.ok();a.click()}return}
  if(b==='back'){closeApp()}
}

/* ================= input routing ================= */
function route(b){
  if(phase==='off'){boot();return}
  if(phase==='boot'){if(b==='ok')showUsers();return}
  if(phase==='users'){if(b==='ok')login();return}
  if(phase==='rest'){wake();return}
  if(phase!=='on')return;
  if(modalOn){if(b==='back'){sfx.back();modalBack()}else if(['up','down','left','right'].includes(b))spatial($('#mb'),b);else if(b==='ok'){const a=document.activeElement;if(a&&$('#mb').contains(a)){sfx.ok();a.click()}}return}
  if(quickOn){if(b==='back'||b==='home'){sfx.back();closeQuick()}else if(b==='up'||b==='down')spatial($('#qp'),b);else if(b==='ok'){const a=document.activeElement;if(a&&$('#qp').contains(a)){sfx.ok();a.click()}}return}
  if(b==='home'){openQuick();return}
  if(cur)return appInput(b);
  homeInput(b);
}
const held={left:false,right:false,up:false,down:false},padHeld={left:false,right:false,up:false,down:false};
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',' ':'ok',Escape:'back',Backspace:'back',q:'home',Q:'home',o:'options',Home:'home'};
addEventListener('keydown',e=>{
  ac();
  const t=e.target,typing=t&&(t.tagName==='INPUT'&&!['range','checkbox','button'].includes(t.type)||t.tagName==='TEXTAREA'||t.isContentEditable);
  if(typing){
    if(e.key==='Escape'){t.blur();e.preventDefault()}
    else if((e.key==='ArrowUp'||e.key==='ArrowDown')&&t.tagName==='INPUT'){e.preventDefault();route(e.key==='ArrowUp'?'up':'down')}
    return;
  }
  if(t&&t.tagName==='SELECT'&&(e.key==='ArrowUp'||e.key==='ArrowDown'))return;
  if(t&&t.type==='range'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
  const k=e.key.length===1?e.key:e.key;
  const dir={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',A:'left',D:'right'}[k];if(dir)held[dir]=true;
  const b=KEYMAP[k];if(!b)return;
  if(e.key===' '&&cur&&cur.id==='drift'){}
  e.preventDefault();route(b);
});
addEventListener('keyup',e=>{const dir={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',A:'left',D:'right'}[e.key];if(dir)held[dir]=false});
addEventListener('blur',()=>{for(const k in held)held[k]=false});

/* gamepad */
// Polling only runs while a controller is connected; with none plugged in there's nothing to read each frame.
let gpPrev={},gpRep={},padName='',polling=false;
function pollPads(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];let p=null;for(const x of pads)if(x){p=x;break}
  if(!p){polling=false;if(padName){padName='';$('#stPad').classList.add('hidden')}return}
  requestAnimationFrame(pollPads);
  if(p.id!==padName){padName=p.id;$('#stPad').classList.remove('hidden');$('#stPad').innerHTML=I.pad}
  const bt=i=>!!(p.buttons[i]&&p.buttons[i].pressed),ax=i=>p.axes[i]||0;
  const st={up:bt(12)||ax(1)<-.55,down:bt(13)||ax(1)>.55,left:bt(14)||ax(0)<-.55,right:bt(15)||ax(0)>.55,ok:bt(0),back:bt(1),home:bt(16)||bt(8),options:bt(9)};
  for(const k of['left','right','up','down'])padHeld[k]=st[k];
  const now=performance.now();
  for(const k in st){
    if(st[k]&&!gpPrev[k]){ac();route(k);gpRep[k]=now+380}
    else if(st[k]&&['up','down','left','right'].includes(k)&&now>gpRep[k]&&!(cur&&['drift','breaker','skyline'].includes(cur.id))){route(k);gpRep[k]=now+110}
  }
  gpPrev=st;
}
function startPads(){if(!polling){polling=true;requestAnimationFrame(pollPads)}}
addEventListener('gamepadconnected',e=>{startPads();toast('Controller connected',e.gamepad.id.slice(0,40),I.pad);if(phase==='on')trophy('pad');else setTimeout(()=>trophy('pad'),6000)});

    extraBtn(I.reload,'Reload',()=>{if(NATIVE)v.reload();else v.src=v.src});
    extraBtn(I.ext,NATIVE?'Browser':'New tab',()=>openExternal(NATIVE?(()=>{try{return v.getURL()}catch{return a.url}})():a.url));

  }};

/* --- Browser --- */
function normURL(q){q=q.trim();if(!q)return'';if(/^[a-z]+:\/\//i.test(q))return q;if(/^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(q)||/^localhost(:\d+)?/.test(q))return'https://'+q;return(NATIVE?'https://www.google.com/search?q=':'https://www.google.com/search?igu=1&q=')+encodeURIComponent(q)}
APPS.browser={title:()=>'Internet Browser',icon:()=>({svg:'globe',c1:B.browser.c1,c2:B.browser.c2}),
  build(body,o){
    body.innerHTML=`<div class="bwrap">
      <div class="bbar">
        <button class="ib" id="bBack" title="Back">${I.back}</button><button class="ib" id="bFwd" title="Forward">${I.fwd}</button>
        <button class="ib" id="bRe" title="Reload">${I.reload}</button><button class="ib" id="bHome" title="Start page">${I.home}</button>
        <div class="urlw">${I.search}<input id="bUrl" placeholder="Search or enter address" spellcheck="false" autocomplete="off"></div>
        <button class="ib" id="bStar" title="Bookmark">${I.star}</button><button class="ib" id="bExt" title="${NATIVE?'Open in your browser':'Open in new tab'}">${I.ext}</button>
      </div>
      <div class="bview"><div class="bhome" id="bHomeP"></div>${viewHTML('bFrame')}</div>
      ${NATIVE?'':`<div class="bhint">Tip: some sites (YouTube, Reddit…) refuse to load inside other pages. If a page stays blank, <button id="bExt2">open it in a new tab ↗</button> — or run the ORBIT desktop app.</div>`}
    </div>`;
    const fr=$('#bFrame'),url=$('#bUrl');
    let cur='';const hist=[];let hi=-1;// iframe mode keeps its own history; webviews have real history
    const showView=on=>{$('#bHomeP').classList.toggle('hidden',on);fr.style.visibility=on?'visible':'hidden'};
    const record=u=>{cur=u;url.value=u;starState();S.stats.pages++;S.history=[{url:u,t:Date.now()},...S.history.filter(h=>h.url!==u)].slice(0,30);save();if(S.stats.pages>=10)trophy('surfer')};
    if(NATIVE){
      fr.addEventListener('did-navigate',e=>record(e.url));
      fr.addEventListener('did-navigate-in-page',e=>{if(e.isMainFrame){cur=e.url;url.value=e.url;starState()}});
    }
    function home(){showView(false);url.value='';cur='';if(!NATIVE){fr.src='about:blank';hi=-1;hist.length=0}starState();renderHomeP()}
    function renderHomeP(){
      $('#bHomeP').innerHTML=`<div class="bsearch">${LOGO}<div class="urlw">${I.search}<input id="bQ" placeholder="Search the web or type a URL" spellcheck="false" autocomplete="off"></div></div>
        <div class="sec" style="max-width:900px;margin:0 auto"><h2>Bookmarks</h2></div>
        <div class="dial">${S.bookmarks.map((b,i)=>`<button data-b="${i}"><div class="di" style="--g1:${b.c1||'#3a6bd8'};--g2:${b.c2||'#1a3a8a'}">${logo(b)}</div><span>${esc(b.name)}</span></button>`).join('')}</div>
        ${S.history.length?`<div class="sec" style="max-width:900px;margin:30px auto 0"><h2>Recently visited</h2><div class="feed">${S.history.slice(0,6).map((h,i)=>`<button class="fe" data-h="${i}" style="text-align:left"><div class="fi2">${logo({url:h.url,name:hostOf(h.url)})}</div><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.url)}</span><time>${ago(h.t)}</time></button>`).join('')}</div></div>`:''}`;
      $('#bQ').onkeydown=e=>{if(e.key==='Enter'){go(normURL(e.target.value))}};
      $$('[data-b]',$('#bHomeP')).forEach(b=>b.onclick=()=>go(S.bookmarks[+b.dataset.b].url));
      $$('[data-h]',$('#bHomeP')).forEach(b=>b.onclick=()=>go(S.history[+b.dataset.h].url));
    }
    function go(u){
      if(!u)return;showView(true);
      if(NATIVE){fr.src=u;url.value=u;setTimeout(()=>fr.focus(),50);return}
      hist.splice(hi+1);hist.push(u);hi=hist.length-1;fr.src=u;record(u);
    }
    function starState(){const on=!!cur&&S.bookmarks.some(b=>b.url===cur);const s=$('#bStar');s.classList.toggle('on',on);s.innerHTML=on?I.starF:I.star}
    url.onkeydown=e=>{if(e.key==='Enter'){go(normURL(url.value));url.blur()}};
    url.onfocus=()=>url.select();
    $('#bBack').onclick=()=>{
      if(NATIVE){let can=false;try{can=fr.canGoBack()}catch{}if(can)fr.goBack();else home();return}
      if(hi>0){hi--;fr.src=hist[hi];cur=hist[hi];url.value=cur;starState()}else if(hi===0)home()};
    $('#bFwd').onclick=()=>{
      if(NATIVE){try{if(fr.canGoForward()){showView(true);fr.goForward()}}catch{}return}
      if(hi<hist.length-1){hi++;fr.src=hist[hi];cur=hist[hi];url.value=cur;starState()}};
    $('#bRe').onclick=()=>{if(!cur)return;if(NATIVE)fr.reload();else fr.src=cur};
    $('#bHome').onclick=home;
    const ext=()=>{if(cur)openExternal(cur);else toast('Nothing to open','Load a page first',I.info)};
    $('#bExt').onclick=ext;if($('#bExt2'))$('#bExt2').onclick=ext;
    $('#bStar').onclick=()=>{const u=cur;if(!u)return;const i=S.bookmarks.findIndex(b=>b.url===u);
      if(i>=0){S.bookmarks.splice(i,1);toast('Bookmark removed',hostOf(u),I.star)}else{S.bookmarks.push({name:hostOf(u),url:u});toast('Bookmarked',hostOf(u),I.starF)}save();starState()};
    extraBtn(I.star,'Bookmarks',home);
    home();if(o.url)go(o.url);
    return{focus:()=>o.url?$('#bBack'):$('#bQ')};
  }};

/* --- App Store --- */
APPS.store={title:()=>'App Store',icon:()=>({svg:'bag',c1:B.store.c1,c2:B.store.c2}),
  build(body,o){
    let cat='All',q='';
    const cats=['All',...new Set(CATALOG.map(c=>c.cat))];
    function render(){
      body.innerHTML=`<div class="pane">
        <div class="h1">App Store</div><div class="muted">${CATALOG.length} web apps and games. ${NATIVE?'Everything opens right here on the console.':'Apps marked <span class="mode">TAB</span> open in a new browser tab because those sites block embedding — run the ORBIT desktop app to open everything on the console.'}</div>
        <div class="sec card"><h2 style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;font-weight:500;margin-bottom:14px">Create your own app</h2>
          <div class="grid form">
            <div><label class="f">Name</label><input class="inp" id="cName" placeholder="My App"></div>
            <div><label class="f">URL</label><input class="inp" id="cUrl" placeholder="example.com"></div>
            <div><label class="f">Color</label><input class="inp" id="cCol" type="color" value="#3a7bff" style="padding:4px"></div>
            <div><label class="f">Opens</label><select class="inp" id="cMode"><option value="frame">On console</option><option value="tab">In new tab</option></select></div>
            <button class="btn pri" id="cAdd">${I.plus}Add</button>
          </div></div>
        <div class="sec"><h2>Browse</h2><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><div class="urlw" style="flex:0 1 320px;height:36px">${I.search}<input id="sQ" placeholder="Search apps and games" spellcheck="false" autocomplete="off"></div><div class="chips" id="sChips"></div></div></div>
        <div class="grid sgrid" id="sGrid" style="margin-top:16px"></div>
      </div>`;
      $('#cAdd').onclick=createApp;
      $('#cUrl').onkeydown=e=>{if(e.key==='Enter')createApp()};
      $('#sQ').value=q;$('#sQ').oninput=e=>{q=e.target.value.trim().toLowerCase();grid()};
      chips();grid();
    }
    function chips(){
      $('#sChips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
      $$('[data-c]',body).forEach(b=>b.onclick=()=>{cat=b.dataset.c;chips();grid();$(`[data-c="${cat}"]`,body).focus()});
    }
    function grid(){
      const list=CATALOG.filter(c=>(cat==='All'||c.cat===cat)&&(!q||(c.name+' '+c.desc+' '+c.cat).toLowerCase().includes(q)));
      $('#sGrid').innerHTML=list.length?list.map(c=>{const has=S.apps.some(a=>a.id===c.id);return`<div class="card scard"><div class="si" style="--g1:${c.c1};--g2:${c.c2}">${logo(c)}</div><div style="min-width:0"><h4>${esc(c.name)}${!NATIVE&&c.mode==='tab'?'<span class="mode">TAB</span>':''}</h4><div class="cat">${c.cat}</div><p>${esc(c.desc)}</p><div class="row"><button class="btn ${has?'':'pri'}" data-add="${c.id}">${has?I.check+'On home':I.plus+'Add'}</button><button class="btn" data-open="${c.id}">Open</button></div></div></div>`}).join(''):'<div class="card muted">No apps match that search.</div>';
      $$('[data-add]',body).forEach(b=>b.onclick=()=>{const c=CATALOG.find(x=>x.id===b.dataset.add);if(S.apps.some(a=>a.id===c.id)){removeApp(c.id)}else addApp(c);grid();$(`[data-add="${c.id}"]`,body)?.focus()});
      $$('[data-open]',body).forEach(b=>b.onclick=()=>openWeb(CATALOG.find(x=>x.id===b.dataset.open)));
    }
    function createApp(){
      const name=$('#cName').value.trim(),raw=$('#cUrl').value.trim();
      if(!raw){sfx.err();$('#cUrl').focus();toast('Enter a URL','e.g. example.com',I.info);return}
      const url=/^[a-z]+:\/\//i.test(raw)?raw:'https://'+raw;
      const col=$('#cCol').value;const dark='#'+col.slice(1).match(/../g).map(h=>Math.round(parseInt(h,16)*.4).toString(16).padStart(2,'0')).join('');
      const app={id:'c'+Date.now().toString(36),custom:true,name:name||hostOf(url),url,c1:col,c2:dark,mode:$('#cMode').value,desc:'Custom web app · '+hostOf(url)};
      addApp(app);trophy('maker');render();
    }
    render();
    return{rerender:grid,focus:()=>o.focusForm?$('#cName'):$('#sQ')};
  }};

/* --- Settings --- */
APPS.settings={title:()=>'Settings',icon:()=>({svg:'gear',c1:'#5a6b8f',c2:'#232c44'}),
  build(body,o){
    const TABS=[['theme','Themes','palette'],['sound','Sound','vol'],['profile','Profile','user'],['apps','Web Apps','apps'],['system','System','sys'],['about','About','info']];
    let tab=o.tab||'theme';
    body.innerHTML=`<div class="set"><nav>${TABS.map(([k,n,ic])=>`<button data-t="${k}">${I[ic]}${n}</button>`).join('')}</nav><div class="sp" id="sp"></div></div>`;
    const sp=$('#sp');
    const tog=(key,label,sub)=>`<button class="tog ${S[key]?'on':''}" data-tog="${key}"><span>${label}${sub?`<small>${sub}</small>`:''}</span><span class="sw"></span></button>`;
    function render(){
      $$('[data-t]',body).forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
      let h='';
      if(tab==='theme')h=`<div class="h1">Themes</div><div class="muted">Pick the look of your home screen.</div>
        <div class="sec grid themes">${Object.entries(THEMES).map(([k,t])=>`<button class="th ${S.theme===k?'on':''}" data-th="${k}" style="background:linear-gradient(140deg,${t.bg[0]},${t.bg[1]} 60%,${t.bg[2]})"><i style="background:${t.accent}"></i>${t.name}</button>`).join('')}</div>
        <div class="sec grid">${tog('waves','Animated waves','The flowing ribbons in the background')}${tog('particles','Floating particles')}</div>`;
      if(tab==='sound')h=`<div class="h1">Sound</div><div class="sec grid">${tog('sound','Interface sounds','Navigation clicks, chimes and trophy fanfare')}
        <div class="card"><label class="f">Volume — ${Math.round(S.vol*100)}%</label><input type="range" id="sVol" min="0" max="1" step="0.05" value="${S.vol}"></div>
        <button class="btn" id="sTest">${I.vol}Play test sound</button></div>`;
      if(tab==='profile')h=`<div class="h1">Profile</div><div class="sec grid" style="max-width:520px"><div><label class="f">Online ID</label><input class="inp" id="pName" maxlength="20" value="${esc(S.name)}"></div>
        <div><label class="f">Avatar</label><div class="avs">${AVATARS.map((a,i)=>`<button data-av="${i}" class="${i===avIdx()?'on':''}">${avatar(i)}</button>`).join('')}</div></div>
        <div><button class="btn pri" id="pSave">Save profile</button></div></div>`;
      if(tab==='apps')h=`<div class="h1">Web Apps</div><div class="muted">Reorder, change how each app opens, or remove it.</div>
        <div class="sec grid">${S.apps.length?S.apps.map((a,i)=>`<div class="wrow"><div class="wi" style="--g1:${a.c1};--g2:${a.c2}">${logo(a)}</div><div class="wn"><b>${esc(a.name)}</b><div>${esc(a.url)}</div></div>
          <button class="ib" data-mv="${i}:-1" title="Move left">${I.left}</button><button class="ib" data-mv="${i}:1" title="Move right">${I.right}</button>
          <button class="btn" data-md="${i}" style="height:32px;font-size:12px">${external(a)?I.ext+(NATIVE?'Browser':'New tab'):I.sys+'On console'}</button>
          <button class="ib" data-rm="${i}" title="Remove">${I.trash}</button></div>`).join(''):'<div class="card muted">No web apps yet.</div>'}
        <div><button class="btn pri" id="goStore">${I.bag}Open App Store</button></div></div>`;
      if(tab==='system')h=`<div class="h1">System</div><div class="sec grid">${tog('clock24','24-hour clock')}${tog('bootAnim','Boot animation','Show the logo and chime when powering on')}
        <button class="btn" id="sxClr">${I.trash}Clear browser history</button>
        <button class="btn" id="sxExp">${I.ext}Export settings</button>
        <button class="btn dng" id="sxReset">${I.restart}Reset console to factory defaults</button></div>`;
      if(tab==='about'){
        let bytes=0;try{bytes=(localStorage.getItem(LS)||'').length}catch{}
        h=`<div class="h1">About</div><div class="sec card"><dl class="kv">
        <dt>System</dt><dd>ORBIT System Software 1.0</dd><dt>Console name</dt><dd>${esc(S.name)}'s ORBIT</dd>
        <dt>Screen</dt><dd>${screen.width} × ${screen.height}</dd><dt>Controller</dt><dd>${esc(padName||'None connected (keyboard)')}</dd>
        <dt>Web apps installed</dt><dd>${S.apps.length}</dd><dt>Times booted</dt><dd>${S.stats.boots}</dd><dt>Storage used</dt><dd>${(bytes/1024).toFixed(1)} KB</dd></dl></div>
        <div class="sec"><h2>Controls</h2><div class="card"><dl class="kv">
        <dt>Arrows / D-pad / stick</dt><dd>Move</dd><dt>Enter / Space / A</dt><dd>Select</dd><dt>Esc / Backspace / B</dt><dd>Back · close app</dd>
        <dt>Q / Home / Guide</dt><dd>Quick menu</dd><dt>O / Start</dt><dd>Options (on a web app tile)</dd><dt>↓ on a tile</dt><dd>Shortcuts for that app</dd></dl></div></div>`;
      }
      sp.innerHTML=h;wire();
    }
    function wire(){
      $$('[data-tog]',sp).forEach(b=>b.onclick=()=>{const k=b.dataset.tog;S[k]=!S[k];save();b.classList.toggle('on',S[k]);clock()});
      $$('[data-th]',sp).forEach(b=>b.onclick=()=>{setTheme(b.dataset.th);$$('[data-th]',sp).forEach(x=>x.classList.toggle('on',x===b))});
      if($('#sVol')){$('#sVol').oninput=e=>{S.vol=+e.target.value;save();$('label.f',sp).textContent=`Volume — ${Math.round(S.vol*100)}%`};$('#sVol').onchange=()=>sfx.ok();$('#sTest').onclick=()=>sfx.trophy()}
      if($('#pSave')){let av=avIdx();$$('[data-av]',sp).forEach(b=>b.onclick=()=>{av=+b.dataset.av;$$('[data-av]',sp).forEach(x=>x.classList.toggle('on',x===b))});
        $('#pSave').onclick=()=>{const n=$('#pName').value.trim()||'Player 1';if(n!==S.name||av!==S.avatar)trophy('identity');S.name=n;S.avatar=av;save();renderStatus();toast('Profile saved',n,`<span class="tlogo">${avatar(av)}</span>`)};
        $('#pName').onkeydown=e=>{if(e.key==='Enter')$('#pSave').click()}}
      $$('[data-mv]',sp).forEach(b=>b.onclick=()=>{const[i,d]=b.dataset.mv.split(':').map(Number),j=i+d;if(j<0||j>=S.apps.length)return;[S.apps[i],S.apps[j]]=[S.apps[j],S.apps[i]];save();render();$(`[data-mv="${j}:${d}"]`,sp)?.focus()});
      $$('[data-md]',sp).forEach(b=>b.onclick=()=>{const a=S.apps[+b.dataset.md];if(NATIVE)a.external=!a.external;else a.mode=a.mode==='tab'?'frame':'tab';save();render();$(`[data-md="${b.dataset.md}"]`,sp)?.focus()});
      $$('[data-rm]',sp).forEach(b=>b.onclick=()=>{const a=S.apps[+b.dataset.rm];confirmBox('Remove '+a.name+'?','It will be removed from your home screen.','Remove',()=>{removeApp(a.id);render()})});
      if($('#goStore'))$('#goStore').onclick=()=>openApp('store');
      if($('#sxClr'))$('#sxClr').onclick=()=>{S.history=[];save();toast('Browser history cleared','',I.trash)};
      if($('#sxExp'))$('#sxExp').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='orbit-settings.json';a.click()};
      if($('#sxReset'))$('#sxReset').onclick=()=>confirmBox('Reset console?','All web apps, trophies, profile and settings will be erased.','Reset',()=>{try{localStorage.removeItem(LS)}catch{}S=defaults();save();setTheme(S.theme);S.trophies={};save();powerOff(true)});
    }
    $$('[data-t]',body).forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
    render();
    return{focus:()=>$(`[data-t="${tab}"]`,body),rerender:render};
  }};
