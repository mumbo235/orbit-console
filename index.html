/* --- Music (generative) --- */
const TRACKS=[
  {name:'Aurora Drift',bpm:70,root:57,prog:[[0,4,7,11],[-3,0,4,7],[5,9,12,16],[2,5,9,12]],c1:'#5bb0ff',c2:'#1d3f9a'},
  {name:'Neon Harbor',bpm:92,root:50,prog:[[0,3,7,10],[5,8,12,15],[-2,2,5,9],[3,7,10,14]],c1:'#ff5ea8',c2:'#7a1f8f'},
  {name:'Glass Gardens',bpm:64,root:60,prog:[[0,4,7,14],[-5,-1,2,9],[-3,0,4,11],[-7,-3,0,7]],c1:'#3ddc97',c2:'#0b5a44'},
  {name:'Midnight Menu',bpm:80,root:53,prog:[[0,3,7,12],[-4,0,3,10],[-2,2,5,12],[-5,-1,2,10]],c1:'#8a98ff',c2:'#26246a'},
  {name:'Sunset Loading',bpm:76,root:55,prog:[[0,4,7,9],[-3,0,4,7],[-7,-3,0,4],[-5,-1,2,7]],c1:'#ffa25a',c2:'#8a2c3a'},
];
const mf=m=>440*2**((m-69)/12);
const Music={playing:false,ti:0,step:0,nextT:0,timer:null,out:null,an:null,dly:null,
  init(){const c=ac();if(this.out||!c)return;this.out=c.createGain();this.an=c.createAnalyser();this.an.fftSize=256;
    this.dly=c.createDelay(1);const fb=c.createGain();fb.gain.value=.38;const wet=c.createGain();wet.gain.value=.35;
    this.dly.connect(fb).connect(this.dly);this.dly.connect(wet).connect(this.out);this.out.connect(this.an).connect(c.destination);this.setVol()},
  setVol(){if(this.out)this.out.gain.value=.55*S.vol},
  start(){const c=ac();if(!c)return;this.init();this.setVol();this.playing=true;this.step=0;this.nextT=c.currentTime+.1;clearInterval(this.timer);this.timer=setInterval(()=>this.sched(),30);trophy('dj');renderStatus()},
  stop(){this.playing=false;clearInterval(this.timer);if(this.out){const c=ac();this.out.gain.setTargetAtTime(0,c.currentTime,.3);setTimeout(()=>{if(!this.playing)this.setVol()},1500)}renderStatus()},
  toggle(){this.playing?this.stop():this.start()},
  next(){this.ti=(this.ti+1)%TRACKS.length;if(this.playing){this.stop();setTimeout(()=>this.start(),250)}renderStatus()},
  prev(){this.ti=(this.ti-1+TRACKS.length)%TRACKS.length;if(this.playing){this.stop();setTimeout(()=>this.start(),250)}renderStatus()},
  sched(){const c=AC,tr=TRACKS[this.ti],dur=60/tr.bpm/2;this.dly.delayTime.value=dur*3;
    while(this.nextT<c.currentTime+.15){const s=this.step,ch=tr.prog[Math.floor(s/16)%tr.prog.length],t=this.nextT;
      if(s%16===0)ch.forEach(n=>this.pad(mf(tr.root+n),t,dur*16));
      if(s%8===0)this.bass(mf(tr.root+ch[0]-24),t,dur*6);
      const pat=[0,2,1,3,2,1,3,2],n=ch[pat[s%8]]+12+(s%32>=16&&s%4===3?12:0);
      if(Math.random()>.18)this.pluck(mf(tr.root+n),t,dur*3,s%4===0?.09:.055);
      if(s%16===14&&Math.random()>.5)this.pluck(mf(tr.root+ch[3]+24),t,dur*4,.03);
      this.step++;this.nextT+=dur}},
  pad(f,t,d){const c=AC,g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+d*.3);g.gain.linearRampToValueAtTime(0,t+d*1.05);
    [-6,6].forEach(dt=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+d*1.1)});lp.connect(g).connect(this.out)},
  pluck(f,t,d,v){const c=AC,o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.out);g.connect(this.dly);o.start(t);o.stop(t+d+.05)},
  bass(f,t,d){const c=AC,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(this.out);o.start(t);o.stop(t+d+.05)},
};
APPS.music={title:()=>'Ambience',icon:()=>({svg:'music',c1:B.music.c1,c2:B.music.c2}),
  build(body){
    body.innerHTML=`<div class="mus"><div class="tl">${TRACKS.map((t,i)=>`<button class="trk" data-k="${i}"><div class="tc" style="--g1:${t.c1};--g2:${t.c2}">${I.music}</div><div><b>${t.name}</b><span>${t.bpm} BPM · generative</span></div></button>`).join('')}</div>
      <div class="stage"><canvas id="mViz"></canvas><div class="now"><span class="muted" id="mSt"></span><b id="mName"></b></div>
      <div class="ctl"><button class="ib" id="mPrev">${I.prev}</button><button class="ib play" id="mPlay"></button><button class="ib" id="mNext">${I.next}</button></div></div></div>`;
    const ui=()=>{$('#mName').textContent=TRACKS[Music.ti].name;$('#mSt').textContent=Music.playing?'Now playing':'Paused';$('#mPlay').innerHTML=Music.playing?I.pause:I.play;$$('.trk',body).forEach((b,i)=>b.classList.toggle('on',i===Music.ti))};
    $$('.trk',body).forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(k===Music.ti&&Music.playing)return;Music.ti=k;if(Music.playing){Music.stop();setTimeout(()=>{Music.start();ui()},250)}else Music.start();ui()});
    $('#mPlay').onclick=()=>{Music.toggle();ui()};$('#mNext').onclick=()=>{Music.next();setTimeout(ui,300);ui()};$('#mPrev').onclick=()=>{Music.prev();setTimeout(ui,300);ui()};
    ui();
    const c=$('#mViz'),x=c.getContext('2d');let raf;const arr=new Uint8Array(128);
    const draw=t=>{raf=requestAnimationFrame(draw);const[w,h]=fitCanvas(c);x.clearRect(0,0,w,h);
      if(Music.an)Music.an.getByteFrequencyData(arr);const n=64,bw=w/n,th=TRACKS[Music.ti];
      const g=x.createLinearGradient(0,h,0,0);g.addColorStop(0,th.c2);g.addColorStop(1,th.c1);x.fillStyle=g;
      for(let i=0;i<n;i++){const v=Music.playing?arr[i+2]/255:.04+.03*Math.sin(t/600+i/4);const bh=Math.max(3,v*h*.9);x.globalAlpha=.85;x.fillRect(i*bw+2,(h-bh)/2,bw-4,bh)}x.globalAlpha=1};
    raf=requestAnimationFrame(draw);
    return{onClose:()=>cancelAnimationFrame(raf),focus:()=>$('#mPlay')};
  }};

/* --- Drift (mini game) --- */
APPS.drift={title:()=>'Drift',icon:()=>({svg:'pad',c1:B.drift.c1,c2:B.drift.c2}),
  build(body){
    body.innerHTML=`<div class="game"><canvas id="gC"></canvas><div class="ghud"><div><span class="muted">SCORE</span><b id="gS">0</b></div><div style="text-align:right"><span class="muted">BEST</span><b id="gB">${S.stats.best}</b></div></div><div class="gover" id="gO"></div></div>`;
    const c=$('#gC'),x=c.getContext('2d');let w,h,raf,last=0;
    const st={px:.5,vx:0,shards:[],gems:[],trail:[],score:0,t:0,alive:false,started:false,spawn:0,gspawn:2,mouse:null};
    const over=$('#gO');
    function msg(title,sub){over.innerHTML=`<div><h2>${title}</h2><p>${sub}</p></div>`;over.classList.remove('hidden')}
    function reset(){Object.assign(st,{px:.5,vx:0,shards:[],gems:[],trail:[],score:0,t:0,alive:true,started:true,spawn:0,gspawn:2});over.classList.add('hidden');sfx.ok()}
    msg('DRIFT','Dodge the shards · collect gems<br><br><kbd>←</kbd> <kbd>→</kbd> or mouse to steer &nbsp; <kbd>Enter</kbd> to start');
    c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();st.mouse=(e.clientX-r.left)/r.width});
    c.addEventListener('pointerdown',()=>{if(!st.alive)reset()});
    function die(){st.alive=false;const sc=Math.floor(st.score);tone(300,.4,'sawtooth',.06,0,80);
      if(sc>S.stats.best){S.stats.best=sc;save();$('#gB').textContent=sc}
      if(sc>=100)trophy('drift100');if(sc>=500)trophy('drift500');log(`Scored ${sc} in Drift`,'pad');
      msg('GAME OVER',`Score ${sc}${sc>=S.stats.best&&sc>0?' — new best!':''}<br><br><kbd>Enter</kbd> to play again · <kbd>Esc</kbd> to quit`)}
    function frame(t){
      raf=requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;
      [w,h]=fitCanvas(c);const th=theme(),U=Math.min(w,h);
      const bg=x.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#03050d');bg.addColorStop(1,th.bg[2]);x.fillStyle=bg;x.fillRect(0,0,w,h);
      // perspective grid
      x.strokeStyle=`rgba(${th.wave},.12)`;x.lineWidth=DPR;const hz=h*.35,off=(st.t*0.6)%1;
      for(let i=0;i<14;i++){const y=hz+(h-hz)*Math.pow((i+off)/14,2);x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}
      for(let i=-10;i<=10;i++){x.beginPath();x.moveTo(w/2+i*w*.02,hz);x.lineTo(w/2+i*w*.22,h);x.stroke()}
      if(st.alive){
        st.t+=dt;const spd=1+st.t/25;st.score+=dt*10*spd;
        const L=held.left||padHeld.left,R=held.right||padHeld.right;
        if(L||R){st.mouse=null;st.vx+=(R-L)*dt*4.2}
        else if(st.mouse!=null){st.vx+=(st.mouse-st.px)*dt*28}
        st.vx*=Math.pow(.02,dt);st.px=Math.max(.03,Math.min(.97,st.px+st.vx*dt*1.4));
        st.spawn-=dt;if(st.spawn<=0){st.spawn=Math.max(.16,.65-st.t/70);st.shards.push({x:Math.random(),y:-.05,r:.018+Math.random()*.025,vy:.32+Math.random()*.25,rot:Math.random()*6,vr:(Math.random()-.5)*4})}
        st.gspawn-=dt;if(st.gspawn<=0){st.gspawn=2+Math.random()*2;st.gems.push({x:.1+Math.random()*.8,y:-.05})}
        const py=.86;
        for(const s of st.shards){s.y+=s.vy*spd*dt;s.rot+=s.vr*dt;const dx=(s.x-st.px)*w,dy=(s.y-py)*h;if(Math.hypot(dx,dy)<(s.r*U+U*.018)*.9){die();break}}
        for(const g of st.gems){g.y+=.3*spd*dt;const dx=(g.x-st.px)*w,dy=(g.y-py)*h;if(!g.got&&Math.hypot(dx,dy)<U*.045){g.got=1;st.score+=25;tone(1568,.12,'sine',.07);tone(2093,.18,'sine',.06,.06)}}
        st.shards=st.shards.filter(s=>s.y<1.1);st.gems=st.gems.filter(g=>g.y<1.1&&!g.got);
        st.trail.push(st.px);if(st.trail.length>18)st.trail.shift();
        $('#gS').textContent=Math.floor(st.score);
      }
      // gems
      for(const g of st.gems){const gx=g.x*w,gy=g.y*h,r=U*.016;x.save();x.translate(gx,gy);x.rotate(Math.PI/4);x.shadowColor='#7ff';x.shadowBlur=20*DPR;x.fillStyle='#bff';x.fillRect(-r,-r,r*2,r*2);x.restore()}
      // shards
      for(const s of st.shards){const sx=s.x*w,sy=s.y*h,r=s.r*U;x.save();x.translate(sx,sy);x.rotate(s.rot);x.beginPath();x.moveTo(0,-r);x.lineTo(r*.8,r*.7);x.lineTo(-r*.9,r*.5);x.closePath();
        x.fillStyle='rgba(255,90,120,.85)';x.shadowColor='#f36';x.shadowBlur=14*DPR;x.fill();x.restore()}
      // player
      const py=.86*h;st.trail.forEach((p,i)=>{x.fillStyle=`rgba(${th.wave},${i/st.trail.length*.25})`;x.beginPath();x.arc(p*w,py+(st.trail.length-i)*U*.008,U*.018*(i/st.trail.length),0,7);x.fill()});
      x.save();x.shadowColor=th.accent;x.shadowBlur=30*DPR;x.fillStyle='#fff';x.beginPath();x.arc(st.px*w,py,U*.018,0,7);x.fill();x.restore();
      x.strokeStyle=th.accent;x.lineWidth=2*DPR;x.beginPath();x.arc(st.px*w,py,U*.03,st.t*4,st.t*4+4.4);x.stroke();
    }
    raf=requestAnimationFrame(frame);
    return{onClose:()=>cancelAnimationFrame(raf),focus:()=>null,
      handle:b=>{if(b==='ok'){if(!st.alive)reset();return true}if(['left','right','up','down'].includes(b))return true;if(b==='back'&&st.alive){st.alive=false;msg('PAUSED','<kbd>Enter</kbd> to restart · <kbd>Esc</kbd> to quit');return true}return false}};
  }};


/* --- shared game shell --- */
function gameShell(body,id,lowerBetter){
  body.innerHTML=`<div class="game"><canvas></canvas><div class="ghud"><div><span class="muted">SCORE</span><b class="gs">0</b></div><div style="text-align:right"><span class="muted">BEST</span><b class="gb">${best(id)||0}</b></div></div><div class="gover"></div></div>`;
  const c=$('canvas',body),over=$('.gover',body),g={c,x:c.getContext('2d'),w:0,h:0};
  g.msg=(t,sub)=>{over.innerHTML=`<div><h2>${t}</h2><p>${sub}</p></div>`;over.classList.remove('hidden')};
  g.hide=()=>over.classList.add('hidden');
  g.score=n=>$('.gs',body).textContent=n;
  g.finish=n=>{const b=best(id);const nb=lowerBetter?(!b||n<b):n>b;if(nb){S.stats.bests[id]=n;save();$('.gb',body).textContent=n}return nb};
  g.fit=()=>{[g.w,g.h]=fitCanvas(c)};
  g.bg=()=>{const th=theme(),x=g.x,bg=x.createLinearGradient(0,0,0,g.h);bg.addColorStop(0,'#03050d');bg.addColorStop(1,th.bg[2]);x.fillStyle=bg;x.fillRect(0,0,g.w,g.h)};
  // virtual-resolution helper: returns scale + offset so a VW×VH field fits centred
  g.view=(VW,VH)=>{const k=Math.min(g.w/VW,g.h/VH);return{k,ox:(g.w-VW*k)/2,oy:(g.h-VH*k)/2}};
  return g;
}
const pauseHandle=(st,g)=>b=>{if(b==='back'&&st.alive){st.alive=false;st.paused=true;g.msg('PAUSED','<kbd>Enter</kbd> resume · <kbd>Esc</kbd> quit');return true}return false};

/* --- Serpent --- */
APPS.serpent={title:()=>'Serpent',icon:()=>({svg:'snake',c1:B.serpent.c1,c2:B.serpent.c2}),
  build(body){
    const g=gameShell(body,'serpent'),COLS=30,ROWS=18;let raf,last=0;
    const st={alive:false,paused:false,sn:[],dir:{x:1,y:0},q:[],food:null,acc:0,step:.12,score:0,pulse:0};
    const place=()=>{do{st.food={x:Math.random()*COLS|0,y:Math.random()*ROWS|0}}while(st.sn.some(p=>p.x===st.food.x&&p.y===st.food.y))};
    const reset=()=>{Object.assign(st,{alive:true,paused:false,sn:[{x:8,y:9},{x:7,y:9},{x:6,y:9}],dir:{x:1,y:0},q:[],acc:0,step:.12,score:0});place();g.hide();g.score(0);sfx.ok()};
    const die=()=>{st.alive=false;tone(260,.4,'sawtooth',.06,0,70);const nb=g.finish(st.score);if(st.score>=200)trophy('serpent');log(`Scored ${st.score} in Serpent`,'snake');
      g.msg('GAME OVER',`Score ${st.score}${nb&&st.score?' — new best!':''}<br><br><kbd>Enter</kbd> play again · <kbd>Esc</kbd> quit`)};
    function tick(){
      if(st.q.length)st.dir=st.q.shift();
      const h={x:st.sn[0].x+st.dir.x,y:st.sn[0].y+st.dir.y};
      const eat=h.x===st.food.x&&h.y===st.food.y;
      const body2=eat?st.sn:st.sn.slice(0,-1);
      if(h.x<0||h.y<0||h.x>=COLS||h.y>=ROWS||body2.some(p=>p.x===h.x&&p.y===h.y))return die();
      st.sn.unshift(h);
      if(eat){st.score+=10;g.score(st.score);st.step=Math.max(.055,st.step*.965);tone(880+st.sn.length*12,.08,'sine',.07);place()}else st.sn.pop();
    }
    g.msg('SERPENT','Eat the orbs · avoid walls and your tail<br><br><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> steer &nbsp; <kbd>Enter</kbd> start');
    function frame(t){
      raf=requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;
      if(st.alive){st.acc+=dt;while(st.acc>=st.step&&st.alive){st.acc-=st.step;tick()}}
      st.pulse+=dt;g.fit();g.bg();const x=g.x,th=theme();
      const cs=Math.floor(Math.min(g.w*.92/COLS,(g.h-90*DPR)/ROWS)),bw=cs*COLS,bh=cs*ROWS,ox=(g.w-bw)/2,oy=(g.h-bh)/2+20*DPR;
      x.fillStyle='rgba(255,255,255,.035)';x.fillRect(ox,oy,bw,bh);x.strokeStyle=`rgba(${th.wave},.25)`;x.lineWidth=2*DPR;x.strokeRect(ox,oy,bw,bh);
      x.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<COLS;i++)for(let j=0;j<ROWS;j++)if((i+j)%2)x.fillRect(ox+i*cs,oy+j*cs,cs,cs);
      if(st.food){const fx=ox+(st.food.x+.5)*cs,fy=oy+(st.food.y+.5)*cs,r=cs*(.3+.05*Math.sin(st.pulse*6));x.save();x.shadowColor='#ff5e8a';x.shadowBlur=20*DPR;x.fillStyle='#ff8fb0';x.beginPath();x.arc(fx,fy,r,0,7);x.fill();x.restore()}
      const n=st.sn.length;st.sn.forEach((p,i)=>{const a=1-i/n*.55;x.fillStyle=i===0?'#fff':`rgba(${th.wave},${a})`;x.beginPath();x.roundRect(ox+p.x*cs+1.5*DPR,oy+p.y*cs+1.5*DPR,cs-3*DPR,cs-3*DPR,cs*.3);x.fill()});
      if(n){x.save();x.shadowColor=th.accent;x.shadowBlur=18*DPR;x.fillStyle='#fff';x.beginPath();x.roundRect(ox+st.sn[0].x*cs+1.5*DPR,oy+st.sn[0].y*cs+1.5*DPR,cs-3*DPR,cs-3*DPR,cs*.3);x.fill();x.restore()}
    }
    raf=requestAnimationFrame(frame);
    const D={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}},ph=pauseHandle(st,g);
    return{onClose:()=>cancelAnimationFrame(raf),focus:()=>null,handle:b=>{
      if(D[b]){const lastD=st.q.length?st.q[st.q.length-1]:st.dir,d=D[b];if(st.alive&&st.q.length<3&&!(d.x===-lastD.x&&d.y===-lastD.y)&&!(d.x===lastD.x&&d.y===lastD.y))st.q.push(d);return true}
      if(b==='ok'){if(st.paused){st.paused=false;st.alive=true;g.hide()}else if(!st.alive)reset();return true}
      return ph(b)}};
  }};

/* --- Breaker --- */
APPS.breaker={title:()=>'Breaker',icon:()=>({svg:'bricks',c1:B.breaker.c1,c2:B.breaker.c2}),
  build(body){
    const g=gameShell(body,'breaker'),VW=800,VH=520;let raf,last=0,V={k:1,ox:0,oy:0};
    const st={alive:false,paused:false,px:400,pw:120,ball:null,bricks:[],lives:3,level:1,score:0,mouse:null,parts:[]};
    const COLORS=['#ff5e8a','#ffa25a','#f5c542','#3ddc97','#2fc4ff','#8a7dff'];
    const build=()=>{st.bricks=[];const cols=10,bw=70,bh=22,gap=6,sx=(VW-(cols*bw+(cols-1)*gap))/2;
      for(let r=0;r<6;r++)for(let c=0;c<cols;c++)st.bricks.push({x:sx+c*(bw+gap),y:62+r*(bh+gap),w:bw,h:bh,col:COLORS[r],hp:st.level>2&&r<2?2:1})};
    const serve=()=>{st.ball={x:st.px,y:VH-50,vx:0,vy:0,r:8,stuck:true}};
    const speed=()=>360+st.level*45;
    const reset=()=>{Object.assign(st,{alive:true,paused:false,px:400,lives:3,level:1,score:0,parts:[]});build();serve();g.hide();g.score(0);sfx.ok()};
    const launch=()=>{if(st.ball.stuck){const a=(Math.random()-.5)*.8;st.ball.vx=Math.sin(a)*speed();st.ball.vy=-Math.cos(a)*speed();st.ball.stuck=false;tone(660,.08,'sine',.07)}};
    const over=()=>{st.alive=false;const nb=g.finish(st.score);log(`Scored ${st.score} in Breaker`,'bricks');tone(220,.5,'sawtooth',.06,0,60);
      g.msg('GAME OVER',`Score ${st.score} · Level ${st.level}${nb&&st.score?' — new best!':''}<br><br><kbd>Enter</kbd> play again · <kbd>Esc</kbd> quit`)};
    g.msg('BREAKER','Smash every brick · 3 lives<br><br><kbd>←</kbd> <kbd>→</kbd> or mouse to move &nbsp; <kbd>Enter</kbd> launch');
    g.c.addEventListener('pointermove',e=>{const r=g.c.getBoundingClientRect();st.mouse=((e.clientX-r.left)*DPR-V.ox)/V.k});
    g.c.addEventListener('pointerdown',()=>{if(!st.alive&&!st.paused)reset();else if(st.alive)launch()});
    function frame(t){
      raf=requestAnimationFrame(frame);const dt=Math.min(.033,(t-last)/1000||0);last=t;
      g.fit();g.bg();V=g.view(VW,VH);const x=g.x,th=theme();
      if(st.alive){
        const L=held.left||padHeld.left,R=held.right||padHeld.right;
        if(L||R){st.mouse=null;st.px+=(R-L)*720*dt}else if(st.mouse!=null)st.px+=(st.mouse-st.px)*Math.min(1,dt*18);
        st.px=Math.max(st.pw/2,Math.min(VW-st.pw/2,st.px));
        const b=st.ball;
        if(b.stuck){b.x=st.px;b.y=VH-50}
        else{
          b.x+=b.vx*dt;b.y+=b.vy*dt;
          if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);tone(500,.04,'sine',.04)}if(b.x>VW-b.r){b.x=VW-b.r;b.vx=-Math.abs(b.vx);tone(500,.04,'sine',.04)}
          if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy);tone(500,.04,'sine',.04)}
          const py=VH-36;
          if(b.vy>0&&b.y+b.r>=py&&b.y+b.r<=py+16&&Math.abs(b.x-st.px)<=st.pw/2+b.r){
            const sp=speed(),f=Math.max(-.92,Math.min(.92,(b.x-st.px)/(st.pw/2)));b.vx=f*sp*.8;b.vy=-Math.sqrt(sp*sp-b.vx*b.vx);b.y=py-b.r;tone(440,.06,'triangle',.07)}
          for(const k of st.bricks){if(k.hp<=0)continue;
            const nx=Math.max(k.x,Math.min(b.x,k.x+k.w)),ny=Math.max(k.y,Math.min(b.y,k.y+k.h));
            if((b.x-nx)**2+(b.y-ny)**2<=b.r*b.r){
              const ox2=Math.min(b.x+b.r-k.x,k.x+k.w-(b.x-b.r)),oy2=Math.min(b.y+b.r-k.y,k.y+k.h-(b.y-b.r));
              if(ox2<oy2)b.vx=-b.vx;else b.vy=-b.vy;
              k.hp--;if(k.hp<=0){st.score+=10*st.level;g.score(st.score);for(let i=0;i<10;i++)st.parts.push({x:k.x+k.w/2,y:k.y+k.h/2,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,l:.6,c:k.col})}
              tone(700+Math.random()*500,.07,'sine',.06);break}}
          if(b.y>VH+20){st.lives--;tone(180,.3,'sawtooth',.05);if(st.lives<=0)over();else serve()}
          if(st.alive&&st.bricks.every(k=>k.hp<=0)){trophy('breaker');st.level++;build();serve();toast('Level '+st.level,'Faster ball incoming',I.bricks);sfx.trophy()}
        }
      }
      st.parts=st.parts.filter(p=>(p.l-=dt)>0);st.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt});
      x.save();x.translate(V.ox,V.oy);x.scale(V.k,V.k);
      x.fillStyle='rgba(255,255,255,.03)';x.fillRect(0,0,VW,VH);x.strokeStyle=`rgba(${th.wave},.25)`;x.lineWidth=2;x.strokeRect(0,0,VW,VH);
      for(const k of st.bricks){if(k.hp<=0)continue;const gr=x.createLinearGradient(0,k.y,0,k.y+k.h);gr.addColorStop(0,k.col);gr.addColorStop(1,'rgba(0,0,0,.25)');x.fillStyle=k.col;x.beginPath();x.roundRect(k.x,k.y,k.w,k.h,4);x.fill();x.fillStyle=gr;x.fill();
        if(k.hp>1){x.strokeStyle='#fff';x.lineWidth=2;x.stroke()}x.fillStyle='rgba(255,255,255,.35)';x.fillRect(k.x+4,k.y+3,k.w-8,3)}
      st.parts.forEach(p=>{x.globalAlpha=p.l/.6;x.fillStyle=p.c;x.fillRect(p.x-2,p.y-2,4,4)});x.globalAlpha=1;
      x.save();x.shadowColor=th.accent;x.shadowBlur=16;x.fillStyle='#fff';x.beginPath();x.roundRect(st.px-st.pw/2,VH-36,st.pw,12,6);x.fill();
      if(st.ball){x.beginPath();x.arc(st.ball.x,st.ball.y,st.ball.r,0,7);x.fill()}x.restore();
      x.fillStyle='rgba(255,255,255,.7)';x.font='300 16px Inter,system-ui';x.textAlign='center';x.fillText(`LEVEL ${st.level}   ·   ${'●'.repeat(Math.max(0,st.lives))}`,VW/2,34);
      x.restore();
    }
    raf=requestAnimationFrame(frame);const ph=pauseHandle(st,g);
    return{onClose:()=>cancelAnimationFrame(raf),focus:()=>null,handle:b=>{
      if(b==='ok'){if(st.paused){st.paused=false;st.alive=true;g.hide()}else if(!st.alive)reset();else launch();return true}
      if(['left','right','up','down'].includes(b))return true;return ph(b)}};
  }};

/* --- Pairs --- */
APPS.pairs={title:()=>'Pairs',icon:()=>({svg:'cards',c1:B.pairs.c1,c2:B.pairs.c2}),
  build(body){
    const SET=[['bolt','#ffcc33','#c2410c'],['flame','#ff6b4a','#8f1d2c'],['crown','#f5c542','#7a4a10'],['heart','#ff5e8a','#7a1240'],['diamond','#7fe0ff','#1d5a9a'],['leaf','#5fdc7a','#14572c'],['planet','#2fd1c5','#0b4f6a'],['rocket','#8a7dff','#2e1f8f']];
    let deck,open,moves,matched,lock,t0,timer;
    function deal(){
      deck=[...SET,...SET].map((s,i)=>({s,k:i})).sort(()=>Math.random()-.5);open=[];moves=0;matched=0;lock=false;t0=0;clearInterval(timer);
      body.innerHTML=`<div class="pane"><div class="pstat"><div><span class="muted">MOVES</span><b id="pM">0</b></div><div><span class="muted">TIME</span><b id="pT">0:00</b></div><div><span class="muted">BEST</span><b>${best('pairs')||'—'}</b></div></div>
        <div class="pairs">${deck.map((d,i)=>`<button class="pc" data-p="${i}"><div class="in"><div class="b">${I.spark}</div><div class="f" style="--g1:${d.s[1]};--g2:${d.s[2]}">${I[d.s[0]]}</div></div></button>`).join('')}</div></div>`;
      $$('.pc',body).forEach(b=>b.onclick=()=>flip(+b.dataset.p));
      $('.pc',body).focus();
    }
    const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
    function flip(i){
      const el=$$('.pc',body)[i];if(lock||el.classList.contains('open')||el.classList.contains('done'))return;
      if(!t0){t0=Date.now();timer=setInterval(()=>{const e=$('#pT');if(e)e.textContent=fmt((Date.now()-t0)/1000)},500)}
      el.classList.add('open');open.push(i);tone(900,.05,'sine',.05);
      if(open.length<2)return;
      moves++;$('#pM').textContent=moves;const[a,b]=open,A=$$('.pc',body)[a],Bc=$$('.pc',body)[b];
      if(deck[a].s[0]===deck[b].s[0]){open=[];matched++;A.classList.add('done');Bc.classList.add('done');tone(1320,.15,'sine',.07,.05);
        if(matched===SET.length){clearInterval(timer);const secs=(Date.now()-t0)/1000,nb=g2(moves);if(moves<=14)trophy('pairs');log(`Cleared Pairs in ${moves} moves`,'cards');sfx.trophy();
          modal(`<h3>All pairs found!</h3><p>${moves} moves in ${fmt(secs)}${nb?' — new best!':''}</p><div class="mbtns"><button class="btn pri" id="pAgain">${I.restart}Play again</button><button class="btn" id="pQuit">Back to home</button></div>`);
          $('#pAgain').onclick=()=>{closeModal();deal()};$('#pQuit').onclick=()=>{closeModal();closeApp()}}}
      else{lock=true;setTimeout(()=>{A.classList.remove('open');Bc.classList.remove('open');open=[];lock=false},800)}
    }
    const g2=m=>{const b=best('pairs');if(!b||m<b){S.stats.bests.pairs=m;save();return true}return false};
    extraBtn(I.restart,'New game',()=>deal());
    deal();
    return{onClose:()=>clearInterval(timer),focus:()=>$('.pc',body)};
  }};

/* --- Skyline --- */
APPS.skyline={title:()=>'Skyline',icon:()=>({svg:'stack',c1:B.skyline.c1,c2:B.skyline.c2}),
  build(body){
    const g=gameShell(body,'skyline'),VW=600,VH=800,BH=38;let raf,last=0,V={k:1,ox:0,oy:0};
    const st={alive:false,paused:false,stack:[],cur:null,dir:1,cam:0,debris:[],score:0,combo:0,flash:0};
    const col=n=>`hsl(${(205+n*9)%360} 75% ${58-(n%2)*6}%)`;
    const spawn=()=>{const top=st.stack[st.stack.length-1],n=st.stack.length;st.dir=n%2?1:-1;
      st.cur={x:st.dir>0?-top.w:VW,w:top.w,y:top.y-BH,n,sp:220+Math.min(260,n*9)}};
    const reset=()=>{Object.assign(st,{alive:true,paused:false,stack:[{x:150,w:300,y:VH-60,n:0}],debris:[],score:0,combo:0,cam:0});spawn();g.hide();g.score(0);sfx.ok()};
    const over=()=>{st.alive=false;const nb=g.finish(st.score);if(st.score>=20)trophy('skyline');log(`Built ${st.score} floors in Skyline`,'stack');tone(200,.5,'sawtooth',.05,0,60);
      g.msg('TOWER DOWN',`${st.score} floor${st.score===1?'':'s'}${nb&&st.score?' — new best!':''}<br><br><kbd>Enter</kbd> build again · <kbd>Esc</kbd> quit`)};
    function drop(){
      const c=st.cur,top=st.stack[st.stack.length-1];
      const l=Math.max(c.x,top.x),r=Math.min(c.x+c.w,top.x+top.w);
      if(r-l<=0){st.debris.push({...c,vy:0,vr:(Math.random()-.5)*2,rot:0});st.cur=null;return over()}
      if(Math.abs(c.x-top.x)<5){c.x=top.x;st.combo++;st.flash=1;tone(660+st.combo*80,.18,'sine',.08);if(st.combo>=3&&c.w<300){c.w=Math.min(300,c.w+12);c.x-=6}}
      else{st.combo=0;const cut=c.x<top.x?{x:c.x,w:top.x-c.x}:{x:top.x+top.w,w:c.x+c.w-(top.x+top.w)};st.debris.push({x:cut.x,w:cut.w,y:c.y,n:c.n,vy:0,vr:(c.x<top.x?-1:1)*1.5,rot:0});c.x=l;c.w=r-l;tone(520,.1,'triangle',.07)}
      st.stack.push({x:c.x,w:c.w,y:c.y,n:c.n});st.score++;g.score(st.score);spawn();
    }
    g.msg('SKYLINE','Drop each floor onto the last · line it up perfectly to grow<br><br><kbd>Enter</kbd> / <kbd>Space</kbd> / click to drop');
    g.c.addEventListener('pointerdown',()=>{if(st.alive)drop();else if(!st.paused)reset()});
    function frame(t){
      raf=requestAnimationFrame(frame);const dt=Math.min(.033,(t-last)/1000||0);last=t;
      if(st.alive&&st.cur){const c=st.cur;c.x+=st.dir*c.sp*dt;if(c.x>VW-c.w*.2&&st.dir>0)st.dir=-1;if(c.x<-c.w*.8&&st.dir<0)st.dir=1}
      const target=Math.max(0,st.stack.length*BH-VH*.55);st.cam+=(target-st.cam)*Math.min(1,dt*4);st.flash=Math.max(0,st.flash-dt*3);
      st.debris=st.debris.filter(d=>d.y<VH+st.cam+200);st.debris.forEach(d=>{d.vy+=1400*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt});
      g.fit();const x=g.x,th=theme();
      const sky=x.createLinearGradient(0,0,0,g.h),h=Math.min(1,st.score/40);sky.addColorStop(0,`hsl(${230-h*20} 60% ${8+h*4}%)`);sky.addColorStop(1,th.bg[1]);x.fillStyle=sky;x.fillRect(0,0,g.w,g.h);
      V=g.view(VW,VH);x.save();x.translate(V.ox,V.oy);x.scale(V.k,V.k);x.beginPath();x.rect(-V.ox/V.k,0,g.w/V.k,VH);x.clip();x.translate(0,st.cam);
      x.fillStyle='rgba(255,255,255,.06)';x.fillRect(-1000,VH-22,VW+2000,400);
      const blk=(b,a=1)=>{x.globalAlpha=a;x.fillStyle=col(b.n);x.fillRect(b.x,b.y,b.w,BH-2);x.fillStyle='rgba(255,255,255,.25)';x.fillRect(b.x,b.y,b.w,4);x.fillStyle='rgba(0,0,0,.18)';
        for(let wx=b.x+10;wx<b.x+b.w-12;wx+=22)x.fillRect(wx,b.y+12,10,14);x.globalAlpha=1};
      st.stack.forEach(b=>blk(b));
      if(st.cur){x.save();x.shadowColor='#fff';x.shadowBlur=st.flash*30;blk(st.cur);x.restore()}
      st.debris.forEach(d=>{x.save();x.translate(d.x+d.w/2,d.y+BH/2);x.rotate(d.rot);blk({...d,x:-d.w/2,y:-BH/2},.8);x.restore()});
      x.restore();
      if(st.combo>=2&&st.alive){x.fillStyle='#fff';x.font=`300 ${22*DPR}px Inter,system-ui`;x.textAlign='center';x.fillText('PERFECT ×'+st.combo,g.w/2,90*DPR)}
    }
    raf=requestAnimationFrame(frame);const ph=pauseHandle(st,g);
    return{onClose:()=>cancelAnimationFrame(raf),focus:()=>null,handle:b=>{
      if(b==='ok'){if(st.paused){st.paused=false;st.alive=true;g.hide()}else if(!st.alive)reset();else drop();return true}
      if(['left','right','up','down'].includes(b))return true;return ph(b)}};
  }};

document.documentElement.style.setProperty('--accent',theme().accent);
clock();setInterval(clock,5000);setInterval(()=>{if(phase==='on'&&!cur&&zone==='row')updateSel()},60000);
requestAnimationFrame(bgLoop);startPads();
if(NATIVE)orbitNative.onKey(k=>route(k));
showOff();
</script>
